; AodaFix - Einstellungen fuer die winmm.dll in System\Win32_x86.
; Die Datei ist freiwillig: fehlt sie, gelten genau diese Vorgabewerte.
; Spieldateien werden nie veraendert. Erzeugte Dateien liegen in AodaFix_cache
; (darf jederzeit geloescht werden), das Protokoll in AodaFix.log.

[Prompts]
; Xbox-360-Knopfsymbole in Hinweisen, Menues und Infotexten (statt Tastenkappen)
XboxButtons=1
; Knopfsymbole farbig in die Schriften einbauen (noetig fuer Symbole im Fliesstext)
ColorIcons=1
; Knopf, den die Hilfe-Leiste zeigt: A B X Y START BACK L3 R3 LB RB LT RT
HelpButton=L3
; Hauptmenue: xbox (Xbox-360-Menues), pc (PC-Wuerfel), ps3 (PS3-Wuerfel, ohne dessen
; Trophaeen-Installation), keep (nicht anfassen)
MainMenu=xbox
; Schriftgroesse der Knopf-Hinweise ("Weiterspielen", "Zurueck") im 640x480-Raster.
; Original 35 (volle Zeilenhoehe), Infotexte 16, das Spiel selbst nutzt 20.
; 0 = Hinweise wie im Original (dann gilt auch HintIconSize nicht).
HintSize=20
; Sichtbare Groesse der Knopfsymbole neben den Hinweisen, in der 32er-Textur
; (GUI_Button_*_32, neu erzeugt in den kraeftigen Farben der 360-Grafik). 8 bis 32.
HintIconSize=22
; Startbildschirm "(A) DRUECKEN" und kein "PAUSE"-Schriftzug im Xbox-Pausemenue
MenuTexts=1
; Namen der Stick-Richtungen in Texten: de oder en
AxisNames=de

[Display]
; Randloses Fenster ueber den ganzen Monitor, ohne Klemmung an die Taskleiste
Borderless=1
; Viewport immer auf die ganze Flaeche zwingen (Behelf aus der 1920x1440-Zeit).
; Mit 4K in der Modusliste unnoetig - und in Zwischensequenzen schaedlich
; (heller Streifen oben, versetzte Schatten), daher aus.
FullViewport=0
; Alle Anzeigemodi aufzaehlen (sonst ist 3840x2160 unsichtbar, Grenze 512)
AllDisplayModes=1
; VID_MODE in der Environment.cfg auf Desktop-Aufloesung und -Bildrate setzen
DesktopResolution=1
; Gammarampe des Spiels: auto (bei Windows-HDR ignorieren), 1 = erlauben, 0 = nie
GammaRamp=auto

[Renderer]
; HLInclude_GLSL.xrg: unzulaessige texture2D/textureCube-Aufrufe korrigieren
; (neuere Treiber brechen sonst beim Start in GLSL_LoadSrc ab)
ShaderFix=1
; XR_SHADERMODE: keep (ungueltige Werte ausserhalb 0..6 werden trotzdem auf 0 gesetzt)
; oder 0..6 = Auto, 0.5, 1.1, 1.1, 1.4, 2.0, 2.0++
ShaderMode=keep

[Gameplay]
; Zielhilfe: 0 = aus (die Waffenflagge 'autoaim' wird entfernt), 1 = wie im Original
; Der Regler im Optionsmenue ist im Spiel wirkungslos - das hier ist der echte Schalter.
AimAssist=0

[Rumble]
; Vibration aus Content\Feedback\feedback.xrg (die Huellkurven der Xbox 360)
Enable=1
; Gesamtstaerke 0.0 bis 4.0
Gain=1.0
; Motoren tauschen, falls links/rechts vertauscht wirkt
SwapMotors=0
; jeden Effekt protokollieren
Log=0

[Debug]
; jede Datei protokollieren, die das Spiel oeffnet
FileLog=0
; jeden 2D-Text und jedes Textur-Rechteck mit Position protokollieren (Fehlersuche)
TextLog=0
