; AodaFix - settings for the winmm.dll in System\Win32_x86.
; The file is optional: without it exactly these defaults apply.
; Game files are never modified. Generated files go to AodaFix_cache
; (safe to delete at any time), the log to AodaFix.log.

[Prompts]
; Xbox 360 button glyphs in hints, menus and info texts (instead of key caps)
XboxButtons=1
; Build the coloured glyphs into the fonts (needed for icons in body text)
ColorIcons=1
; Button the help bar shows: A B X Y START BACK L3 R3 LB RB LT RT
HelpButton=B
; That button opens the help while the help bar is on screen, and does what it
; is bound to the rest of the time. No binding is changed, F1 keeps working.
; 0 = the button is shown only, the help stays on F1.
HelpButtonOpensHelp=1
; X deletes the last character where a name is typed (profile name). The
; on-screen keyboard has no key for it; the keyboard's Backspace keeps working.
XDeletesCharacter=1
; Info and help texts ("press ...") name the controller button. Without this
; they name the keyboard key or mouse button, whatever is played with.
; Texts about an action that has a key but no button (weapon flashlight,
; eyeshine) name the d-pad direction that does it, as on the console.
; Needs XboxButtons and ColorIcons.
TextButtons=1
; Main menu: xbox (Xbox 360 menus), pc (PC cube), ps3 (PS3 cube, without its
; trophy installation), keep (leave it alone). The console menus get the PC's
; profile list, so a new installation can create its profile there too.
MainMenu=xbox
; Size of the menu button hints ("Continue", "Back") in the 640x480 grid.
; Original 35 (a full line height), info texts 16, the game itself uses 20.
; 0 = hints as in the original (HintIconSize then does not apply either).
HintSize=20
; Visible size of the button icons beside the hints, inside the 32 pixel texture
; (GUI_Button_*_32, regenerated in the strong colours of the 360 artwork). 8 to 32.
HintIconSize=22
; Title screen "PRESS (A)", and no "PAUSE" caption in the Xbox pause menu
MenuTexts=1
; Language of the stick direction names in texts: auto (the game's language),
; or en de fr it es
AxisNames=auto

[Display]
; Ignore Windows' display scaling (125 %, 150 %, ...). Without this Windows
; enlarges the game's window, it no longer matches the resolution being rendered,
; and the picture reaches past the screen edges: only part of it is visible.
; An exe that already carries the "Override high DPI scaling behaviour"
; compatibility flag is left as it is.
DpiAware=1
; Borderless window across the whole monitor, with no clamp to the taskbar
Borderless=1
; Force the viewport to the whole surface (a workaround from the 1920x1440 days).
; Needless once 4K is in the mode list, and harmful in cutscenes (bright strip
; at the top, offset shadows), so off.
FullViewport=0
; Enumerate every display mode (without this 3840x2160 stays invisible, the
; limit is 512)
AllDisplayModes=1
; Set VID_MODE in Environment.cfg to the desktop resolution and refresh rate
DesktopResolution=1
; The game's gamma ramp: auto (ignore it while Windows HDR is on), 1 = allow,
; 0 = never
GammaRamp=auto

[Renderer]
; HLInclude_GLSL.xrg: correct the illegal texture2D/textureCube calls
; (newer drivers abort on start in GLSL_LoadSrc otherwise)
ShaderFix=1
; XR_SHADERMODE: keep (values outside 0..6 are still reset to 0)
; or 0..6 = Auto, 0.5, 1.1, 1.1, 1.4, 2.0, 2.0++
ShaderMode=keep

[Gameplay]
; Aim assist: 0 = off (the weapon flag 'autoaim' is removed), 1 = as shipped.
; The slider in the options menu does nothing in game, this is the real switch.
AimAssist=0
; For testing: 1 = every extra is unlocked, and the developers' menus that are
; still in the game can be opened - the list of all maps with X (or Space) in
; the main menu, then "Zones"; the debug menu with X (or Space) in the pause
; menu. A map started from that list begins without the equipment of the
; chapters before it. The game's own chapter list is not changed: it shows the
; chapter saves a profile has. Once the game stores the extras again they stay
; unlocked in that profile.
UnlockAll=0
; A controller that is switched on while the game is already running is picked
; up. Without this the game only knows the controllers present at its start.
LateController=1
; Language of the game: keep (what the game is set to), or en de fr it es.
; The game has no menu for it. It is read at start, so it applies from the next
; start on; a language that is not installed is not set.
Language=keep

[Rumble]
; Vibration from Content\Feedback\feedback.xrg (the Xbox 360 envelopes)
Enable=1
; Overall strength, 0.0 to 4.0
Gain=1.0
; Swap the motors, in case left and right feel the wrong way round
SwapMotors=0
; Log every effect
Log=0

[Debug]
; Log every file the game opens
FileLog=0
; Log every 2D text and texture rectangle with its position (fault finding)
TextLog=0
; Log every controller event the game receives, with its code (fault finding).
; Keyboard keys are never logged.
PadLog=0
; Log which part of the game reads which key binding and names which key
; (fault finding for texts that show the wrong key). Nothing typed is logged.
KeyTextLog=0
